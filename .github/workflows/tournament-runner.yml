name: Tournament runner checks

on:
  pull_request:
    paths:
      - "tools/tournament/**"
      - ".github/workflows/tournament-runner.yml"
  workflow_dispatch:

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runner dependency
        run: python -m pip install -r tools/tournament/requirements.txt
      - name: Compile Python script
        run: python -m py_compile tools/tournament/run_tournament.py
      - name: Check command-line interface
        run: python tools/tournament/run_tournament.py --help
